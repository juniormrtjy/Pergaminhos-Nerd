<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Explore Pergaminhos Nerd com uma trilha do Spotify escolhida por você."><meta name="theme-color" content="#263d33"><title>Sala do Bardo · Pergaminhos Nerd</title><link rel="icon" href="assets/icons/crest.svg"><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/music.css"><script defer src="js/music-config.js"></script><script defer src="js/radio.js"></script></head>
